# Production on a VPS: the app behind Caddy (automatic HTTPS). Run from the repository root:
#   docker compose -f deploy/docker-compose.vps.yml up -d --build
# See docs/deploy-vps.md.
services:
  app:
    build: ..
    image: aiwithrc-rag:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      COOKIE_SECURE: "true"
      # Only Caddy can reach the app (no published port), so its X-Forwarded-For is trusted.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ../data:/data
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
